services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "marketplace", "-d", "marketplace"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://marketplace:marketplace@db:5432/marketplace
      MARKETPLACE_VENUE: ${MARKETPLACE_VENUE:-digs}
      MARKETPLACE_DEMO_MODE: ${MARKETPLACE_DEMO_MODE:-0}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
      MARKETPLACE_DEVICE_TOKEN: ${MARKETPLACE_DEVICE_TOKEN:-}
      MARKETPLACE_DEVICE_ADAPTER: ${MARKETPLACE_DEVICE_ADAPTER:-atech}
      MARKETPLACE_TURNAROUND_MINUTES: ${MARKETPLACE_TURNAROUND_MINUTES:-2}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:hello@standbyroom.com}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          from urllib.request import urlopen;
          urlopen('http://127.0.0.1:8000/ready', timeout=4).close()
      interval: 2s
      timeout: 5s
      retries: 15

  frontend:
    build:
      context: ..
      dockerfile: marketplace/frontend/Dockerfile
      args:
        MARKETPLACE_API_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - --input-type=module
        - -e
        - >-
          const response = await fetch('http://127.0.0.1:3000/api/ready');
          if (!response.ok) process.exit(1);
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
