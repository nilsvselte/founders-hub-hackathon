services:
  - type: web
    name: roomline-marketplace-preview-api
    runtime: docker
    plan: free
    dockerContext: ./marketplace/backend
    dockerfilePath: ./marketplace/backend/Dockerfile
    autoDeployTrigger: off
    healthCheckPath: /ready
    envVars:
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        fromDatabase:
          name: roomline-marketplace-preview-db
          property: connectionString
      - key: MARKETPLACE_SECURE_COOKIES
        value: "1"
      - key: MARKETPLACE_DEMO_MODE
        value: "1"

databases:
  - name: roomline-marketplace-preview-db
    plan: free
    ipAllowList: []
