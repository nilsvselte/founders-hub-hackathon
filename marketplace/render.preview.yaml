services:
  - type: web
    name: roomline-marketplace-preview-api
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./marketplace/backend/Dockerfile
    autoDeployTrigger: off
    healthCheckPath: /ready
    envVars:
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        fromDatabase:
          name: roomline-marketplace-preview-db
          property: connectionString
      - key: MARKETPLACE_SECURE_COOKIES
        value: "1"
      - key: MARKETPLACE_DEMO_MODE
        value: "1"
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:hello@standbyroom.com

databases:
  - name: roomline-marketplace-preview-db
    plan: free
    ipAllowList: []
