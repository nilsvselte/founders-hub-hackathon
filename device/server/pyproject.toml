[project]
name = "device-server"
version = "0.1.0"
description = "Room occupancy from Atech sensors, exposed to the marketplace"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
